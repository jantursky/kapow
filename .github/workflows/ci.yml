name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the whole suite at the tag before it publishes.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # macOS, so the klib API dump covers the iOS targets too; Linux cannot build them.
    runs-on: macos-latest
    env:
      # Forks and pull requests from them have no secret; the upload is skipped there instead of failing.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Format, API, JVM and Android host tests, screenshots, coverage gate
        run: ./gradlew spotlessCheck apiCheck :kapow:jvmTest :kapow:testAndroidHostTest :kapow:verifyRoborazziJvm :kapow-crease:jvmTest :kapow-multihaptic:jvmTest :kapow-test:jvmTest koverXmlReport koverVerify
      - name: Docs and README samples compile
        run: python3 scripts/doc-samples.py && ./gradlew :samples:docs-check:compileTestKotlinJvm
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: kapow/build/reports/kover/report.xml,kapow-crease/build/reports/kover/report.xml,kapow-multihaptic/build/reports/kover/report.xml,kapow-test/build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Wasm tests (headless Chrome) and the gallery build
        run: ./gradlew :kapow:wasmJsTest :kapow-crease:wasmJsTest :kapow-multihaptic:wasmJsTest :kapow-test:wasmJsTest :samples:web:wasmJsBrowserDistribution :samples:desktop:build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Gallery wasm size budget
        run: node scripts/check-wasm-size.mjs
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - name: Browser tests of the gallery (Chromium, WebKit, phone)
        run: bunx playwright test --project=desktop --project=webkit --project=phone
      # Firefox logs coroutine exceptions in most gallery tests and does not pass yet, so it reports without
      # blocking a merge or a release. Move it into the step above once it passes.
      - name: Browser tests of the gallery (Firefox, known to fail)
        continue-on-error: true
        run: bunx playwright test --project=firefox
      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Simulator tests
        run: ./gradlew :kapow:iosSimulatorArm64Test :kapow-crease:iosSimulatorArm64Test :kapow-multihaptic:iosSimulatorArm64Test :kapow-test:iosSimulatorArm64Test

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish to Maven Local and compile a consumer against it
        run: ./scripts/pack-test.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build the docs site
        run: bun run build:docs
