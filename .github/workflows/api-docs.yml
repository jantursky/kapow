name: API reference

# Builds the Dokka reference of the four published modules and deploys it to GitHub Pages when a GitHub release is
# published. Run it by hand to publish the current main. The Pages source of the repo must be "GitHub Actions"
# (Settings, Pages); until then the build job still runs and fails the workflow only on KDoc errors.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the reference (a public symbol without KDoc fails the build)
        run: ./gradlew dokkaGenerate
      - name: Name the version on the front page
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          printf '<!doctype html><meta charset="utf-8"><title>Kapow %s API reference</title><meta http-equiv="refresh" content="0; url=html/index.html"><p>Kapow %s API reference. <a href="html/index.html">Open it</a>.</p>' "$version" "$version" > build/dokka/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/dokka

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
